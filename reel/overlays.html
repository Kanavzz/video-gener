<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden;
    font-family: "Inter", "DejaVu Sans", sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; }
  .el { position: absolute; opacity: 0; will-change: opacity, transform; }

  .chip { top: 120px; left: 60px; padding: 14px 26px; border-radius: 999px; background: rgba(12,12,16,.72);
    font-size: 30px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .chip i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #ff3b30;
    margin-right: 14px; vertical-align: 3px; }

  .context { top: 210px; left: 60px; width: 960px; box-sizing: border-box; padding: 34px 40px 30px;
    border-radius: 34px; background: rgba(14,15,20,.88); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .context h2 { margin: 0 0 14px; font-size: 40px; font-weight: 800; letter-spacing: .04em; display: flex; align-items: center; gap: 14px; }
  .context h2 svg { flex: none; }
  .context p { margin: 0; font-size: 39px; line-height: 1.32; font-weight: 500; }
  .context .by { margin-top: 18px; font-size: 30px; font-variant: small-caps; letter-spacing: .06em; color: #c9cbd3; }

  .sub { left: 70px; width: 940px; top: 1280px; text-align: center; }
  .sub span { display: inline; padding: 6px 18px; line-height: 1.5; font-size: 50px; font-weight: 800;
    background: rgba(0,0,0,.62); box-decoration-break: clone; -webkit-box-decoration-break: clone; border-radius: 12px; }
  .sub b { display: block; font-size: 28px; letter-spacing: .14em; color: #ffd60a; margin-bottom: 10px; font-weight: 800; }

  .lower { left: 0; top: 1500px; width: 1080px; }
  .lower .tag { display: inline-block; margin-left: 60px; padding: 10px 22px; background: #fff; color: #c8102e;
    font-weight: 900; font-size: 34px; letter-spacing: .1em; }
  .lower .bar { margin-top: 0; padding: 22px 60px; background: #c8102e; font-size: 46px; font-weight: 900; letter-spacing: .02em; }
  .lower .tick { padding: 12px 60px; background: rgba(10,10,14,.9); font-size: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; }

  .timeline { left: 60px; top: 1530px; width: 960px; height: 170px; box-sizing: border-box; padding: 30px 50px;
    border-radius: 30px; background: rgba(14,15,20,.85); }
  .timeline .line { position: absolute; left: 70px; right: 70px; top: 62px; height: 8px; background: #555a66; border-radius: 4px; }
  .timeline .hl { position: absolute; left: 70px; top: 52px; height: 28px; border-radius: 14px; width: 0;
    background: linear-gradient(90deg, #ffd60a, #ff9f0a); box-shadow: 0 0 30px rgba(255,190,10,.8); }
  .timeline .lab { position: absolute; top: 100px; font-size: 36px; font-weight: 800; transform: translateX(-50%); }

  .notice { right: 60px; top: 1500px; width: 470px; padding: 18px; box-sizing: border-box; background: #6b4423;
    border: 6px solid #c9a24b; box-shadow: 0 10px 30px rgba(0,0,0,.5); transform: rotate(-2deg); }
  .notice div { background: #f3e9d2; color: #2b1d0e; padding: 22px 24px; font-family: "DejaVu Serif", serif;
    font-size: 32px; line-height: 1.4; text-align: center; }
  .notice div em { display: block; font-style: normal; font-size: 24px; letter-spacing: .18em; margin-bottom: 8px; color: #6b4423; }

  .end { inset: 0; background: #0d0e12; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .end h1 { margin: 0 80px; font-size: 86px; line-height: 1.12; font-weight: 900; }
  .end h1 em { font-style: normal; color: #ffd60a; }
  .end p { margin: 50px 0 0; font-size: 40px; font-weight: 600; letter-spacing: .12em; color: #c9cbd3; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// window.SCENE is injected: {chip, context, cues:[{who,text,start,end}], lower_third, timeline, notice, end_card, duration}
const S = window.SCENE;
const stage = document.getElementById("stage");
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function el(cls, html) { const d = document.createElement("div"); d.className = "el " + cls; d.innerHTML = html; stage.appendChild(d); return d; }

const icon = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffd60a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>';

const chip = el("chip", "<i></i>" + esc(S.chip));
const ctx = el("context", `<h2>${icon}${esc(S.context.heading)}</h2><p>${esc(S.context.body)}</p><div class="by">— ${esc(S.context.author)}</div>`);
const subs = S.cues.map(c => el("sub", `<b>${esc(c.who)}</b><span>${esc(c.text)}</span>`));
let lower, tl, hl, notice, end;
if (S.lower_third) lower = el("lower", `<div class="tag">LIVE · 1857</div><div class="bar">${esc(S.lower_third)}</div><div class="tick">Official says: totally under control · Farmers, adivasis, women and landholders seen walking past · Papers on fire</div>`);
if (S.timeline) {
  tl = el("timeline", '<div class="line"></div><div class="hl"></div>' +
    S.timeline.map((t, i) => `<div class="lab" style="left:${70 + i * 410}px">${esc(t)}</div>`).join(""));
  hl = tl.querySelector(".hl");
}
if (S.notice) notice = el("notice", `<div><em>NOTICE</em>${S.notice.map(esc).join("<br>")}</div>`);
if (S.end_card) end = el("end", `<h1>Civilisation?<br><em>It’s complicated.</em></h1><p>— ${esc(S.end_card[1])}</p>`);

const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
function fade(t, a, b, inDur = 0.35, outDur = 0.25) { return Math.min(ease((t - a) / inDur), ease((b - t) / outDur)); }

window.render = function (t) {
  const D = S.duration, endAt = S.end_card ? D - 2.0 : D + 1;
  const c = fade(t, 0.15, endAt, 0.4);
  chip.style.opacity = c;
  const k = fade(t, S.context_at || 1.5, endAt, 0.45);
  ctx.style.opacity = k; ctx.style.transform = `translateY(${(1 - k) * -30}px) scale(${0.96 + 0.04 * k})`;
  S.cues.forEach((cue, i) => {
    const o = fade(t, cue.start, Math.min(cue.end, endAt), 0.12, 0.12);
    subs[i].style.opacity = o; subs[i].style.transform = `translateY(${(1 - o) * 14}px)`;
  });
  if (lower) { const o = fade(t, 0.3, D + 1, 0.4); lower.style.opacity = o; lower.style.transform = `translateX(${(1 - o) * -120}px)`;
    lower.querySelector(".tick").style.textIndent = `${800 - t * 160}px`; }
  if (tl) { const o = fade(t, 0.5, D + 1, 0.4); tl.style.opacity = o; hl.style.width = `${820 * ease((t - 1.0) / 3.5)}px`; }
  if (notice) { notice.style.opacity = fade(t, 0.4, endAt, 0.4); }
  if (end) { const o = ease((t - endAt) / 0.45); end.style.opacity = o; end.querySelector("h1").style.transform = `scale(${0.92 + 0.08 * o})`; }
};
window.render(0);
</script>
</body>
</html>
